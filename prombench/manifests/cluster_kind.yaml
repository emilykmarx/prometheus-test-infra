kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# For each container's logs, only MaxFiles of MaxSize are kept.
# `kubectl logs` reads the full contents of only the newest file - the rest are on the node.
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    containerLogMaxSize: "10Gi"
    containerLogMaxFiles: 5
nodes:
  - role: control-plane
    image: kindest/node-conftamer:v1.31.1
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "node-name=main-node,cloud.google.com/gke-nodepool=main-node"
  - role: worker
    image: kindest/node-conftamer:v1.31.1
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "isolation=prometheus,node-name=prometheus-{{ .PR_NUMBER }},cloud.google.com/gke-nodepool=prometheus-{{ .PR_NUMBER }}"
  - role: worker
    image: kindest/node-conftamer:v1.31.1
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "isolation=prometheus,node-name=prometheus-{{ .PR_NUMBER }},cloud.google.com/gke-nodepool=prometheus-{{ .PR_NUMBER }}"
  - role: worker
    image: kindest/node-conftamer:v1.31.1
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "isolation=none,node-name=nodes-{{ .PR_NUMBER }},cloud.google.com/gke-nodepool=nodes-{{ .PR_NUMBER }}"
